<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
      }
      button {
        font-size: 20px;
        margin: 10px;
        padding: 10px 20px;
      }
      </style>
</head> 

  <body>

    <h1>Rock Paper Scissors</h1>

    <div class="options">
      <button id="rock">Rock</button>
      <button id="paper">Paper</button>
      <button id="scissors">Scissors</button>
      </div>

      <h2>Your Option: <span id="user-option"></span></h2>
      <h2>Computer Option: <span id="computer-option"></span></h2>
      <h2>Result: <span id="result"></span></h2>

      <script>

        const rockBtn = document.getElementById('rock');
        const paperBtn = document.getElementById('paper');
        const scissorsBtn = document.getElementById('scissors');

        const userOptionSpan = document.getElementById('user-option');
        const computerOptionSpan = document.getElementById('computer-option');
        const resultSpan = document.getElementById('result');

        const options = ['Rock', 'Paper', 'Scissors'];

        const playGame = (userChoice) => {
        const computerChoice = options[Math.floor(Math.random() * options.length)];

        userOptionSpan.innerHTML = userChoice;
        computerOptionSpan.innerHTML = computerChoice;

        if (userChoice === computerChoice) {
        resultSpan.innerHTML = "It's a tie!";
        } else if (
      (userChoice === 'Rock' && computerChoice === 'Scissors') ||
      (userChoice === 'Paper' && computerChoice === 'Rock') ||
      (userChoice === 'Scissors' && computerChoice === 'Paper')
        ) {
      resultSpan.innerHTML = 'You win!';
        } else {
      resultSpan.innerHTML = 'You lose!';
    }
  };

  rockBtn.addEventListener('click', () => playGame('Rock'));
  paperBtn.addEventListener('click', () => playGame('Paper'));
  scissorsBtn.addEventListener('click', () => playGame('Scissors'));

</script>
  </body>
  <html>
